name: Fix attendance absent count
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch summary formula
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/admin-reports-fix.js')
          s = p.read_text()
          old = "absent=active.filter(d=>!attended.has(d));return{present,late,absent:absent.length,total:active.length||(present+late+absent.length),expected:active,attendance};"
          new = "absent=Math.max(0,active.length-present-late);return{present,late,absent,total:active.length||(present+late+absent),expected:active,attendance};"
          if old not in s:
              raise SystemExit('Target summary formula not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-reports-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix absent count to exclude late attendance [skip ci]'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-absent-count.yml
          git commit -m 'Remove one-time absent count workflow [skip ci]'
          git push
