name: One-time fix admin reports
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin reports loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/admin-reports.js')
          s = p.read_text()
          old = '''        try {
            const [empResult, journalResult, leaveResult, izinResult, attResult, settingsResult] = await Promise.all([
                api.getEmployees(),
                api.getAllJournals(),
                api.getAllLeaves(),
                api.getAllIzin(),
                api.getAllAttendance(),
                api.getSettings()
        ]);
            employees = empResult.data || [];
            jurnals = jurnalResult.data || [];
            leaves = leaveResult.data || [];
            izinList = izinResult.data || [];
            attendances = attResult.data || [];

            this.settings = settingsResult.data || {};
        } catch (error) {
            console.error('Error loading report data:', error);
            employees = storage.get('admin_employees', []);
            jurnals = storage.get('jurnals', []);
            leaves = storage.get('leaves', []);
            izinList = storage.get('izin', []);
            attendances = storage.get('attendance', []);
        }'''
          new = '''        try {
            // Load each source independently. One failing endpoint must not
            // force the whole report back to stale localStorage data.
            const results = await Promise.allSettled([
                api.getEmployees(),
                api.getAllJournals(),
                api.getAllLeaves(),
                api.getAllIzin(),
                api.getAllAttendance(),
                api.getSettings()
            ]);

            const [empResult, journalResult, leaveResult, izinResult, attResult, settingsResult] = results;

            employees = empResult.status === 'fulfilled' && empResult.value?.success !== false
                ? (empResult.value?.data || [])
                : storage.get('admin_employees', []);
            jurnals = journalResult.status === 'fulfilled' && journalResult.value?.success !== false
                ? (journalResult.value?.data || [])
                : storage.get('jurnals', []);
            leaves = leaveResult.status === 'fulfilled' && leaveResult.value?.success !== false
                ? (leaveResult.value?.data || [])
                : storage.get('leaves', []);
            izinList = izinResult.status === 'fulfilled' && izinResult.value?.success !== false
                ? (izinResult.value?.data || [])
                : storage.get('izin', []);
            attendances = attResult.status === 'fulfilled' && attResult.value?.success !== false
                ? (attResult.value?.data || [])
                : storage.get('attendance', []);
            this.settings = settingsResult.status === 'fulfilled' && settingsResult.value?.success !== false
                ? (settingsResult.value?.data || {})
                : {};

            results.forEach((result, index) => {
                if (result.status === 'rejected') {
                    console.error('Report data source failed:', index, result.reason);
                }
            });
        } catch (error) {
            console.error('Error loading report data:', error);
        }'''
          if old not in s:
              raise SystemExit('Target block not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/admin-reports.js
          git diff --cached --quiet || git commit -m "Fix admin report data loading fallback"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-admin-reports-fix.yml
          git commit -m "Remove one-time admin reports fix workflow"
          git push
