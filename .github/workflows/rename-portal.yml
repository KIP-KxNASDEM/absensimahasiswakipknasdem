name: Rename Portal Branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize student-facing terminology
        shell: bash
        run: |
          files=$(git grep -Il -e 'Portal Karyawan' -e 'Data Karyawan' -e 'Email / ID Karyawan' -e 'Karyawan' -e 'karyawan' -- ':!.github/workflows/rename-portal.yml' || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              sed -i \
                -e 's/Portal Karyawan/Portal Mahasiswa/g' \
                -e 's/Data Karyawan/Data Mahasiswa/g' \
                -e 's/Email \/ ID Karyawan/Email \/ ID Mahasiswa/g' \
                -e 's/Karyawan/Mahasiswa/g' \
                -e 's/karyawan/mahasiswa/g' \
                "$file"
              git add "$file"
            done <<< "$files"
          fi

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finish student-facing terminology"
          git push
