<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light only">
    <meta name="theme-color" content="#ffffff">
    <title>Portal Mahasiswa</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/absensi.css">
    <link rel="stylesheet" href="css/jurnal.css">
    <link rel="stylesheet" href="css/cuti.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/shift-schedule.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/face-rec.css">
    <link rel="stylesheet" href="css/izin.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Container -->
    <div id="login-container" class="login-container">
        <div class="login-left"><div class="login-animation"><div class="floating-icons"><i class="fas fa-user-tie icon-1"></i><i class="fas fa-briefcase icon-2"></i><i class="fas fa-clock icon-3"></i><i class="fas fa-calendar-check icon-4"></i><i class="fas fa-chart-line icon-5"></i><i class="fas fa-users icon-6"></i></div><div class="central-logo"><div class="logo-ring ring-1"></div><div class="logo-ring ring-2"></div><div class="logo-ring ring-3"></div><div class="logo-core"><i class="fas fa-building"></i></div></div><h1 class="company-name" id="login-company-name">Portal Mahasiswa</h1><p class="tagline">Kelola kehadiran & produktivitas dengan mudah</p></div></div>
        <div class="login-right"><div class="login-form-container"><div class="login-header"><h2>Selamat Datang</h2><p>Silakan login untuk melanjutkan</p></div><form id="login-form" class="login-form"><div class="input-group"><label for="login-email">Email / ID Mahasiswa</label><div class="input-wrapper"><i class="fas fa-envelope"></i><input type="text" id="login-email" placeholder="Masukkan email atau ID" required></div></div><div class="input-group"><label for="login-password">Password</label><div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="login-password" placeholder="Masukkan password" required><button type="button" class="toggle-password" id="toggle-password"><i class="fas fa-eye"></i></button></div></div><div class="role-selector"><label>Login Sebagai:</label><div class="role-options"><label class="role-option"><input type="radio" name="role" value="employee" checked><span class="role-card"><i class="fas fa-user"></i><span>Mahasiswa</span></span></label><label class="role-option"><input type="radio" name="role" value="admin"><span class="role-card"><i class="fas fa-user-shield"></i><span>Admin</span></span></label></div></div><button type="submit" class="btn-login"><span>Login</span><i class="fas fa-arrow-right"></i></button></form><div class="login-footer"><p>&copy; 2026 <span id="footer-company">Portal Mahasiswa</span>. All rights reserved.</p></div></div></div>
    </div>
    <div id="app-container" class="app-container hidden"></div>
    <div class="toast-container" id="toast-container"></div>
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/router.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/absensi.js"></script>
    <script src="js/face-recognition.js"></script>
    <script src="js/izin.js"></script>
    <script src="js/jurnal.js"></script>
    <script src="js/cuti.js"></script>
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-employees.js"></script>
    <script src="js/admin-reports.js"></script>
    <script src="js/admin-reports-fix.js"></script>
    <script src="js/admin-reports-fix2.js"></script>
    <script src="js/shift-schedule.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
